<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="storeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="roofBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0fdf4" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#storeBg)"/>
  
  <!-- Subtle pattern background circle -->
  <circle cx="100" cy="100" r="70" fill="#ffffff" fill-opacity="0.1"/>

  <!-- Store Building Base -->
  <rect x="52" y="98" width="96" height="58" rx="6" fill="url(#roofBg)"/>
  
  <!-- Door -->
  <rect x="88" y="118" width="24" height="38" rx="4" fill="#059669" fill-opacity="0.85"/>
  <circle cx="106" cy="138" r="2" fill="#ffffff"/>

  <!-- Windows -->
  <rect x="62" y="116" width="18" height="22" rx="3" fill="#059669" fill-opacity="0.3"/>
  <rect x="120" y="116" width="18" height="22" rx="3" fill="#059669" fill-opacity="0.3"/>

  <!-- Store Awning / Roof -->
  <path d="M42 98 L50 68 L150 68 L158 98 Z" fill="#ffffff"/>
  
  <!-- Awning stripes -->
  <polygon points="50,68 66,68 62,98 42,98" fill="#10b981"/>
  <polygon points="82,68 98,68 98,98 80,98" fill="#10b981"/>
  <polygon points="114,68 130,68 134,98 116,98" fill="#10b981"/>
  <polygon points="146,68 150,68 158,98 152,98" fill="#10b981"/>

  <!-- Awning scallop bottom -->
  <path d="M42 98 Q47 104 52 98 Q57 104 62 98 Q67 104 72 98 Q77 104 82 98 Q87 104 92 98 Q97 104 102 98 Q107 104 112 98 Q117 104 122 98 Q127 104 132 98 Q137 104 142 98 Q147 104 152 98 Q157 104 158 98" fill="none" stroke="#059669" stroke-width="2"/>

  <!-- Signboard -->
  <rect x="74" y="52" width="52" height="14" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <line x1="82" y1="59" x2="118" y2="59" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
</svg>
